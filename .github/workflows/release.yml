name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(cat VERSION)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "Version: $TAG_VERSION"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract section for this version from CHANGELOG.md
          # Literal prefix match — the header ("## [1.9.0]") contains regex
          # metacharacters ([, ], .), so `$0 ~ ver` treated it as a pattern and
          # matched nothing, yielding empty release notes. index()==1 matches the
          # literal header at the start of the line.
          NOTES=$(awk -v ver="## [$VERSION]" '
            index($0, ver)==1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          # Save to file for later use
          echo "$NOTES" > changelog_notes.txt
          echo "Extracted changelog for version $VERSION"

      - name: Check existing release
        id: existing
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --json body -q .body > existing_body.txt 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found existing release for $TAG"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No existing release for $TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release body
        id: body
        run: |
          # Define the install guide section
          # A prerelease page must not imply the one-liner installs it: install.sh
          # serves the latest STABLE release, so on an rc that command gives the
          # reader something other than what they are reading about.
          #
          # NOTE ON INDENTATION: this is inside a YAML literal block (`run: |`)
          # whose base indent is 10. Heredoc bodies and terminators must sit at
          # exactly that indent so the shell receives them at column 0 -- at any
          # other indent the terminator never matches, and a line at column 0
          # ends the YAML block early (a bare `---` there is read as a YAML
          # document separator, which invalidates the whole workflow file).
          : > install_guide.txt
          if echo "${GITHUB_REF#refs/tags/}" | grep -qE "(alpha|beta|rc)"; then
          cat >> install_guide.txt << 'PREGUIDE_EOF'

          ---

          > **Note:** the install command below fetches the latest **stable** release, not
          > this candidate. To try this build specifically, use the `git checkout` steps in
          > the notes above.
          PREGUIDE_EOF
          fi

          cat >> install_guide.txt << 'GUIDE_EOF'

          ---

          ## Quick Install

          ```bash
          curl -fsSL moav.sh/install.sh | bash
          ```

          This will install MoaV to `/opt/moav` and guide you through setup.

          ## Documentation

          **[moav.sh/docs](https://moav.sh/docs)** — Full documentation

          - [Setup Guide](https://moav.sh/docs/SETUP) — Complete installation instructions
          - [Client Setup](https://moav.sh/docs/CLIENTS) — How to connect from devices
          - [DNS Configuration](https://moav.sh/docs/DNS) — DNS records setup
          - [CLI Reference](https://moav.sh/docs/CLI) — All commands and options
          - [Monitoring](https://moav.sh/docs/MONITORING) — Grafana dashboards and metrics
          - [Troubleshooting](https://moav.sh/docs/TROUBLESHOOTING) — Common issues and solutions
          GUIDE_EOF

          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            # Check if install guide already present in existing body
            if grep -q "## Quick Install" existing_body.txt; then
              echo "Install guide already present, keeping existing body"
              cp existing_body.txt release_body.txt
            else
              echo "Appending install guide to existing body"
              cat existing_body.txt > release_body.txt
              cat install_guide.txt >> release_body.txt
            fi
          else
            echo "Creating new release body with changelog + install guide"
            cat changelog_notes.txt > release_body.txt
            cat install_guide.txt >> release_body.txt
          fi

          echo "Final release body:"
          cat release_body.txt

      - name: Create or Update Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Determine if prerelease. The TITLE carries the warning too: the GitHub
          # "Pre-release" badge is easy to miss in a notification, an RSS item or a
          # Telegram post, and this project is used by people whose safety depends
          # on it working.
          PRERELEASE=""
          TITLE="$TAG"
          if echo "$TAG" | grep -qE "(alpha|beta|rc)"; then
            PRERELEASE="--prerelease"
            TITLE="$TAG — EXPERIMENTAL, not for production use"
          fi

          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            echo "Updating existing release..."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release_body.txt \
              $PRERELEASE
          else
            echo "Creating new release..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release_body.txt \
              $PRERELEASE
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach installer asset
        # install.sh is the source of truth in this repo. moav-site publishes it under
        # moav.sh/install.sh by fetching the latest release asset at deploy time, so
        # users curl from the censorship-reachable vanity domain (never a GitHub host
        # that may be blocked). --clobber makes re-runs idempotent.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" install.sh --clobber
          # llms.txt rides along the same way: authored here, served from
          # moav.sh/llms.txt by moav-site fetching the latest release asset.
          if [ -f llms.txt ]; then gh release upload "$TAG" llms.txt --clobber; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger moav-site deploy
        # moav-site only redeploys on ITS OWN pushes, so without this nudge
        # moav.sh/install.sh keeps serving the previous release until someone
        # remembers to deploy the site (exactly what happened at v2.0.0).
        # Best-effort: a missing/expired token must not fail the release —
        # the site deploy can always be run by hand.
        # Prereleases are skipped on the site side by 'releases/latest' itself
        # (GitHub never points 'latest' at a prerelease), so dispatching on
        # every tag is safe.
        run: |
          if [ -n "${SITE_DISPATCH_TOKEN}" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${SITE_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/MotherofallVPNs/moav-site/dispatches \
              -d '{"event_type":"moav-release"}' \
              && echo "moav-site deploy dispatched." \
              || echo "::warning::moav-site dispatch failed — deploy the site manually (Actions → Deploy Site & Docs → Run workflow)."
          else
            echo "::warning::SITE_DISPATCH_TOKEN not set — deploy moav-site manually so moav.sh serves this release's install.sh."
          fi
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
