name: MR-MMD-2019-MoaV

on:
  workflow_dispatch:

jobs:
  moav:
    name: Run MoaV with Cloudflare Quick Tunnel
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Display runner information
        shell: bash
        run: |
          echo "System information"
          uname -a

          echo "CPU:"
          nproc

          echo "Memory:"
          free -h


      - name: Install packages
        shell: bash
        run: |
          sudo apt update

          sudo apt install -y \
            curl \
            wget \
            git \
            jq \
            qrencode \
            unzip \
            openssl


      - name: Verify Docker
        shell: bash
        run: |
          docker --version
          docker compose version
          docker info >/dev/null

          echo "Docker ready."


      - name: Install cloudflared
        shell: bash
        run: |

          curl -L \
          https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
          -o cloudflared

          chmod +x cloudflared

          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared --version


      - name: Prepare MoaV configuration
        shell: bash
        run: |

          echo "Preparing MoaV..."

          cp .env.example .env


          # Domainless mode
          sed -i 's/^DOMAIN=.*/DOMAIN=/' .env
          sed -i 's/^ACME_EMAIL=.*/ACME_EMAIL=/' .env


          # Temporary admin password
          PASSWORD=$(openssl rand -hex 16)

          sed -i \
          "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$PASSWORD/" \
          .env


          # Enable proxy + admin
          sed -i \
          's/^DEFAULT_PROFILES=.*/DEFAULT_PROFILES=proxy admin/' \
          .env


          # Disable certificate-required protocols
          sed -i 's/^ENABLE_TROJAN=.*/ENABLE_TROJAN=false/' .env
          sed -i 's/^ENABLE_ANYTLS=.*/ENABLE_ANYTLS=false/' .env
          sed -i 's/^ENABLE_HYSTERIA2=.*/ENABLE_HYSTERIA2=false/' .env
          sed -i 's/^ENABLE_DNSTT=.*/ENABLE_DNSTT=false/' .env
          sed -i 's/^ENABLE_SLIPSTREAM=.*/ENABLE_SLIPSTREAM=false/' .env
          sed -i 's/^ENABLE_MASTERDNS=.*/ENABLE_MASTERDNS=false/' .env
          sed -i 's/^ENABLE_TRUSTTUNNEL=.*/ENABLE_TRUSTTUNNEL=false/' .env


          echo ""
          echo "Final configuration:"
          grep -E \
          "DOMAIN|DEFAULT_PROFILES|ENABLE_|ADMIN_PASSWORD" \
          .env || true


          echo ""
          echo "=============================="
          echo "Temporary ADMIN PASSWORD"
          echo "$PASSWORD"
          echo "=============================="


      - name: Install MoaV
        shell: bash
        run: |

          chmod +x moav.sh

          ./moav.sh install


      - name: Bootstrap MoaV
        shell: bash
        run: |

          echo "Running bootstrap..."

          ./moav.sh bootstrap </dev/null


      - name: Start MoaV services
        shell: bash
        run: |

          echo "Starting services..."

          ./moav.sh start


          echo "Waiting for services..."

          sleep 30


          echo "Health check..."

          curl -k \
          https://localhost:9443/api/health \
          || true


      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |

          echo "Starting Cloudflare Tunnel..."


          cloudflared tunnel \
          --url https://localhost:9443 \
          --no-tls-verify \
          --no-autoupdate \
          2>&1 | tee cloudflared.log &


          sleep 20


          echo ""
          echo "================================"
          echo "Tunnel URL"
          echo "================================"


          grep -E \
          "https://.*trycloudflare.com" \
          cloudflared.log \
          || true


          echo "================================"


      - name: Keep alive
        shell: bash
        run: |

          echo "MoaV running."

          while true
          do

            echo "Heartbeat $(date -u)"

            docker ps

            sleep 600

          done
