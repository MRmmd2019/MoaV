name: star history

# Regenerate assets/star-history.svg from this repo's own stargazer timestamps.
#
# It runs HERE, with this repo's GITHUB_TOKEN, because since 2026-06-30 the
# stargazers endpoint is limited to a repo's admins and collaborators — a hosted
# chart service is neither, so third-party embeds render blank. The committed SVG
# means the README shows a static file with no SaaS in the request path.
#
# Every other day at 06:12 UTC. Off the hour on purpose: scheduled jobs pile up
# at :00 and GitHub drops or delays them.
on:
  schedule:
    - cron: '12 6 */2 * *'
  workflow_dispatch:

# Never two of these racing on the same file.
concurrency:
  group: star-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen-star-history.py

      - name: Commit if it changed
        run: |
          # The generator is a no-op when the SVG is byte-identical, so most runs
          # end here and add no commit.
          if git diff --quiet -- assets/star-history.svg; then
            echo "chart unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "chore(assets): refresh star history chart"
          # Rebase rather than fail if something landed while we rendered.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
